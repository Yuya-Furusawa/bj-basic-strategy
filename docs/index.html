  <style>
    * {

      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;

    }
    .container {

      color: #00f5ff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    a:hover {
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(0, 255, 136, 0.2));
      border-color: rgba(0, 245, 255, 0.5);
      transform: translateY(-2px);
    }
    .support {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .support h2 {
      color: #00f5ff;
      font-size: 18px;
      margin-bottom: 12px;
    }
    .support p {
      color: #a0a0a0;
      font-size: 14px;

    }
